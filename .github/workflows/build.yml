name: Build and validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install art authoring tools
        run: |
          python3 -m pip install -r tools/requirements-art.txt
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o "$RUNNER_TEMP/blender-4.3.2-linux-x64.tar.xz"
          curl --fail --location --retry 3 https://download.blender.org/release/Blender4.3/blender-4.3.2.sha256 -o "$RUNNER_TEMP/blender-4.3.2.sha256"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing blender-4.3.2.sha256)
          tar -xf "$RUNNER_TEMP/blender-4.3.2-linux-x64.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.3.2-linux-x64" >> "$GITHUB_PATH"
      - name: Verify assets and data generation
        run: |
          python3 tools/generate_game_assets.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          ./gradlew --no-daemon runData
          git diff --exit-code -- src/main/resources src/generated/resources docs/art
          test -z "$(git ls-files --others --exclude-standard src/main/resources src/generated/resources)"
      - name: Build and test
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: stonedew
          path: build/libs/*.jar
