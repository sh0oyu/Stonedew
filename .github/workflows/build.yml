name: Build and validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify assets and data generation
        run: |
          python3 tools/generate_game_assets.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          ./gradlew --no-daemon runData
          git diff --exit-code -- src/main/resources src/generated/resources docs/art
          test -z "$(git ls-files --others --exclude-standard src/main/resources src/generated/resources)"
      - name: Build and test
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: stonedew
          path: build/libs/*.jar
