plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.resources.exclude '**/.cache/**'
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            systemProperty 'stonedew.narrativeSource', file('src/main/narrative/en_us.json').absolutePath
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { stonedew { sourceSet sourceSets.main } }
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = rootDir
    testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
}
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license, neo_version: neo_version]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
tasks.register('generatePlaceholderAssets', Exec) {
    workingDir rootDir
    commandLine 'python3', 'tools/generate_placeholder_assets.py'
}
